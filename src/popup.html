<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Playlist Lens</title>
  <style>
    :root {
      --bg: #ffffff;
      --border: #e5e5e5;
      --text: #0f0f0f;
      --text-muted: #606060;
      --primary: #065fd4;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1f1f1f;
        --border: #383838;
        --text: #f1f1f1;
        --text-muted: #aaaaaa;
        --primary: #3ea6ff;
      }
    }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      width: 260px;
      box-sizing: border-box;
      font-size: 13px;
      line-height: 1.4;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .logo {
      width: 20px;
      height: 20px;
      background: #c00;
      border-radius: 4px;
    }
    .title {
      font-size: 14px;
      font-weight: 600;
    }
    .status-box {
      background: rgba(0, 0, 0, 0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .version-tag {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 400;
    }
    .footer {
      border-top: 1px solid var(--border);
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }
    a {
      color: var(--primary);
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <div class="header">
      <div class="title">Playlist Lens <span class="version-tag" id="popup-version">v1.2.0</span></div>
    </div>

    <div class="status-box" role="status">
      <p id="status-text" style="margin: 0;">Open a YouTube playlist (Watch Later, Liked videos, or any <code>list=</code> URL). The bar appears above the video rows.</p>
    </div>

    <nav class="footer" aria-label="Playlist Lens links">
      <a href="https://ko-fi.com/jju1s" target="_blank" rel="noopener noreferrer">Support on Ko-fi</a>
      <a href="#" id="open-options">Options</a>
    </nav>
  </main>
  <script src="popup.js"></script>
</body>
</html>
