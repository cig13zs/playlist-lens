<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Playlist Lens</title>
  <style>
    :root {
      --bg: #ffffff;
      --border: #e5e5e5;
      --text: #0f0f0f;
      --text-muted: #606060;
      --primary: #065fd4;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1f1f1f;
        --border: #383838;
        --text: #f1f1f1;
        --text-muted: #aaaaaa;
        --primary: #3ea6ff;
      }
    }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      width: 260px;
      box-sizing: border-box;
      font-size: 13px;
      line-height: 1.4;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .logo {
      width: 20px;
      height: 20px;
      background: #c00;
      border-radius: 4px;
    }
    .title {
      font-size: 14px;
      font-weight: 600;
    }
    .status-box {
      background: rgba(0, 0, 0, 0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .notice {
      color: #c00;
      font-weight: 500;
      display: none;
    }
    .footer {
      border-top: 1px solid var(--border);
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }
    a {
      color: var(--primary);
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">Playlist Lens</div>
  </div>

  <div class="status-box">
    <div id="status-text">Playlist Lens bar appears directly above video rows on YouTube playlist pages (Watch Later, Liked videos, and public playlists).</div>
    <div id="status-notice" class="notice">Couldn't read the page, update pending.</div>
  </div>

  <div class="footer">
    <a href="https://ko-fi.com/jju1s" target="_blank" rel="noopener noreferrer">Support on Ko-fi</a>
    <a href="#" id="open-options">Options</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
